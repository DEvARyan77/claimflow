server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;     # policy PDF uploads

    # /api/claims -> http://api-gateway:8080/claims
    # Docker's DNS (127.0.0.11) is asked again every 10 s, so a rebuilt gateway with a new IP is still found.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://api-gateway:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 200s;  # AI answers can take a while
    }

    # Single-page app: unknown paths (e.g. /coverage) serve index.html and React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
