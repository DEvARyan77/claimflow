name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Java services (build + tests on MongoDB)
    runs-on: ubuntu-latest
    services:
      # MongoDB Atlas Local: plain MongoDB tests + Atlas Vector Search tests
      mongodb:
        image: mongodb/mongodb-atlas-local:8
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/?directConnection=true
      ATLAS_LOCAL_TEST_URI: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 60); do
            docker exec "$(docker ps -qf ancestor=mongodb/mongodb-atlas-local:8)" mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && exit 0
            sleep 3
          done
          exit 1
      - name: Build and test
        run: mvn -B verify

  frontend:
    name: React app (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:demo
