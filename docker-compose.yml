# Start everything:   docker compose up --build
# Then open:          http://localhost:3000
# Stop:               docker compose down        (add -v to also delete the database)

x-backend-env: &backend-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  # Every service uses its own database (patient_db, claims_db, ...) on this MongoDB
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/?directConnection=true}
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: "5672"
  RABBIT_USER: guest
  RABBIT_PASSWORD: guest
  # Policy Assistant AI (set them in a .env file, see .env.example). Empty = search-only mode.
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
  LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
  # Login tokens are signed with this. Set your own long random value in .env for anything public.
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  # Real email (see .env.example). Brevo API key (preferred) or SMTP; both empty = email off.
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  # "Continue with Google": OAuth client ID (Web). Empty = no Google button.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-ClaimFlow}
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  NOTIFY_EMAIL_OVERRIDE: ${NOTIFY_EMAIL_OVERRIDE:-}
  APP_URL: ${APP_URL:-http://localhost:3000}

x-backend-service: &backend-service
  restart: on-failure          # services stop if the Config Server isn't ready yet; Docker starts them again
  environment: *backend-env
  depends_on:
    mongodb:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    config-server:
      condition: service_started
    eureka-server:
      condition: service_started

services:
  # ---------- Infrastructure ----------
  # MongoDB Atlas Local: the same MongoDB as Atlas, including Atlas Vector Search ($vectorSearch)
  # for the policy assistant. Connect with Compass at mongodb://localhost:27017/?directConnection=true
  mongodb:
    image: mongodb/mongodb-atlas-local:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
    # The image has its own health check; it reports healthy once MongoDB and search are up

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"          # dashboard: http://localhost:15672 (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  # ---------- Platform services ----------
  eureka-server:
    build: { context: ., args: { MODULE: eureka-server } }
    ports:
      - "8761:8761"            # dashboard: http://localhost:8761

  config-server:
    build: { context: ., args: { MODULE: config-server } }
    environment: *backend-env
    ports:
      - "8888:8888"

  api-gateway:
    <<: *backend-service
    build: { context: ., args: { MODULE: api-gateway } }
    ports:
      - "9080:8080"   # your machine:container (8080 was busy on this PC)

  # ---------- Business services ----------
  auth-service:
    <<: *backend-service
    build: { context: ., args: { MODULE: auth-service } }

  patient-service:
    <<: *backend-service
    build: { context: ., args: { MODULE: patient-service } }

  provider-service:
    <<: *backend-service
    build: { context: ., args: { MODULE: provider-service } }

  claims-service:
    <<: *backend-service
    build: { context: ., args: { MODULE: claims-service } }

  payment-service:
    <<: *backend-service
    build: { context: ., args: { MODULE: payment-service } }

  notification-service:
    <<: *backend-service
    build: { context: ., args: { MODULE: notification-service } }

  policy-assistant-service:
    <<: *backend-service
    build: { context: ., args: { MODULE: policy-assistant-service } }

  # Optional local AI models. Start with: docker compose --profile ollama up -d ollama (see .env.example)
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # ---------- Frontend ----------
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mongodata:
  mongoconfig:
  ollama:
