server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false   # the registry does not register itself
    fetch-registry: false
  server:
    enable-self-preservation: false        # fine for local/dev; keep it on in production
    eviction-interval-timer-in-ms: 5000    # remove dead instances quickly
