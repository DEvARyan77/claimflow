# Optional: serve configuration from a Git repository instead of the bundled files.
# 1. Push the files from src/main/resources/configs to a GitHub repo (e.g. claimflow-config)
# 2. Start the config server with SPRING_PROFILES_ACTIVE=git and CONFIG_GIT_URI=https://github.com/<you>/claimflow-config
spring:
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: main
          clone-on-start: true
