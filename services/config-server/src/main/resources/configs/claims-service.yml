server:
  port: 8083

spring:
  mongodb:
    database: claims_db

claimflow:
  claims:
    # Claims stuck in SUBMITTED (because Patient/Provider service was down) are re-checked this often
    retry-pending-interval-ms: 30000

spring.cloud.openfeign.client.config:
  # Gemini can take a few seconds to write the fraud review
  fraudReview:
    connect-timeout: 3000
    read-timeout: 30000
