server:
  port: 8084

spring:
  mongodb:
    database: payment_db
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false   # after the retries below, drop the message instead of looping forever
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2

claimflow:
  payment:
    # Pretend talking to the bank takes a few seconds, so the tracker in the UI visibly moves
    processing-delay-ms: 4000
