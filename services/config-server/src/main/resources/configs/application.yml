# Shared by EVERY service (each service also gets its own <service-name>.yml).
# ${NAME:default} = use environment variable NAME if set (Docker), otherwise the default (local run).

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  # MongoDB: one cluster, and each service uses its OWN database (database-per-service).
  # MONGODB_URI examples: mongodb://localhost:27017 (Docker) or mongodb+srv://user:pass@cluster.mongodb.net (Atlas)
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
  data:
    mongodb:
      auto-index-creation: true        # create the @Indexed (unique) indexes on start-up
      representation:
        big-decimal: decimal128        # money stays exact (Decimal128), never a double

claimflow:
  auth:
    # Signs the login tokens (auth-service) and checks them (api-gateway): both read this one value.
    # Set JWT_SECRET to a long random string in any real deployment.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health,info
