server:
  port: 8087

spring:
  mongodb:
    database: auth_db

claimflow:
  auth:
    token-hours: 12                           # how long a login lasts
    app-url: ${APP_URL:http://localhost:3000} # used in emailed links (password reset)
    seed-demo-users: ${SEED_DEMO_USERS:true}  # demo logins for every role, password "password123"
