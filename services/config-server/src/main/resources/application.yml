server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native" = read the config files bundled in src/main/resources/configs.
    # Start with SPRING_PROFILES_ACTIVE=git to read them from a Git repo instead (see application-git.yml).
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs
